name: APK smoke test

# Builds the APK from the checkout, installs it in an Android emulator, launches
# it, and checks that it opened a session with the API. The app defaults to http://10.0.2.2:8787 on
# Android, which is the host loopback from inside the emulator, so the API runs
# on the runner behind a logging proxy that records every request.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Install and launch the APK
    # GitHub's runners expose no nested virtualization, so the emulator runs
    # without hardware acceleration. Same-arch x86_64 emulation is the fastest
    # option that still executes the released native libraries.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Recent emulator builds refuse software CPU emulation unless asked.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../../apk
          cp app/build/outputs/apk/release/app-release.apk ../../../apk/MyMuse.apk
          ls -l ../../../apk
      - name: Start the API and a logging proxy
        env:
          CPK_INTELLIGENCE_API_KEY: ${{ secrets.CPK_INTELLIGENCE_API_KEY }}
        run: |
          set -euo pipefail
          # With the repository secret the sample workspace loads real Rich
          # Threads, so the conversation renders. Without it the server still
          # starts, but it can only prove that the APK reached the API.
          key="${CPK_INTELLIGENCE_API_KEY:-smoke-test-placeholder}"
          if [ -n "$CPK_INTELLIGENCE_API_KEY" ]; then
            echo "Using the CPK_INTELLIGENCE_API_KEY secret for Rich Threads"
          else
            echo "::notice::No CPK_INTELLIGENCE_API_KEY secret, so the conversation store cannot load; add one from 'npx copilotkit@latest project select'."
          fi
          WORKSPACE_MODE=sample COPILOTKIT_TELEMETRY_DISABLED=true \
            CPK_INTELLIGENCE_API_KEY="$key" PORT=8788 pnpm dev > /tmp/api.log 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8788/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::The API did not start"
            tail -20 /tmp/api.log
            exit 1
          fi
          curl -s http://127.0.0.1:8788/api/health
          echo
          cat > /tmp/proxy.mjs <<'JS'
          import fs from "node:fs";
          import http from "node:http";

          const log = fs.createWriteStream("/tmp/requests.log", { flags: "a" });
          http
            .createServer((req, res) => {
              log.write(`${req.method} ${req.url}\n`);
              const upstream = http.request(
                { host: "127.0.0.1", port: 8788, path: req.url, method: req.method, headers: req.headers },
                (response) => {
                  res.writeHead(response.statusCode ?? 502, response.headers);
                  response.pipe(res);
                },
              );
              upstream.on("error", () => {
                res.writeHead(502);
                res.end();
              });
              req.pipe(upstream);
            })
            .listen(8787, "127.0.0.1");
          JS
          node /tmp/proxy.mjs > /tmp/proxy.log 2>&1 &
          sleep 2
          # Talk to the API directly so the request log only holds app traffic.
          curl -s -o /dev/null -w "api health: %{http_code}\n" http://127.0.0.1:8788/api/health
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # The plain AOSP image boots far more reliably than google_apis when
          # the CPU is emulated in software; the app needs no Play services.
          target: default
          arch: x86_64
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1800
          disable-animations: true
          # Software emulation is CPU bound: a 2-core AVD with extra RAM keeps
          # system_server from being starved (and killed) right after boot.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save
            -noaudio -no-boot-anim -memory 3072 -cores 2
          script: |
            set -e
            # Software emulation boots slowly, so wait for the package service
            # instead of assuming adb being up means the system is ready.
            for _ in $(seq 1 60); do adb shell pm path android > /dev/null 2>&1 && break; sleep 5; done
            adb shell pm path android
            for _ in $(seq 1 5); do adb install -r apk/*.apk && break; sleep 20; done
            adb shell pm list packages | grep app.mymuse.mobile
            adb shell am start -n app.mymuse.mobile/.MainActivity
            sleep 45
            adb shell pidof app.mymuse.mobile
            adb logcat -d > /tmp/logcat.txt
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then echo "::error::The app crashed on launch"; grep -A 25 "FATAL EXCEPTION" /tmp/logcat.txt; exit 1; fi
            adb exec-out screencap -p > /tmp/screen.png
            ls -l /tmp/screen.png
      - name: Check that the app called the API
        run: |
          echo "--- API requests seen ---"
          cat /tmp/requests.log || true
          # The app opens a session before it can show anything, so a session
          # request proves the APK really reached the API.
          grep -q "POST /api/session" /tmp/requests.log || {
            echo "::error::The app never opened a session with the API"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apk-smoke-evidence
          if-no-files-found: warn
          path: |
            /tmp/screen.png
            /tmp/logcat.txt
            /tmp/requests.log
            /tmp/api.log
