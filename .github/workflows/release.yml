name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
        env:
          # Blank keeps the localhost default. Set the MYMUSE_API_URL repository
          # variable to ship clients that talk to a hosted API instead.
          EXPO_PUBLIC_API_URL: ${{ vars.MYMUSE_API_URL }}
      - run: pnpm --dir apps/desktop exec electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # The mobile installers are built natively here rather than through EAS, so a
  # release needs no Expo account. The release APK is signed with the debug
  # keystore (installable by sideloading) and the iOS .ipa is unsigned, which
  # means it has to be re-signed with an Apple developer certificate to install.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Create the native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        # The JS bundle is generated here, so this is where the API URL is baked in.
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.MYMUSE_API_URL }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK after the tag
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "apps/mobile/MyMuse-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          if-no-files-found: error
          path: apps/mobile/MyMuse-${{ github.ref_name }}.apk

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Create the native iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the app without signing
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.MYMUSE_API_URL }}
        run: |
          xcodebuild -workspace MyMuse.xcworkspace -scheme MyMuse -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet
      - name: Package the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R apps/mobile/ios/build/Build/Products/Release-iphoneos/MyMuse.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "MyMuse-${{ github.ref_name }}.ipa" Payload
          mv "MyMuse-${{ github.ref_name }}.ipa" "$GITHUB_WORKSPACE/apps/mobile/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build
          if-no-files-found: error
          path: apps/mobile/MyMuse-${{ github.ref_name }}.ipa

  # Store-ready artifacts need real signing: an upload keystore for Play and an
  # Apple development certificate plus provisioning profile for the App Store.
  # EAS holds both, so these jobs only run when the repository has an Expo token
  # and a linked project, and skip with a notice otherwise.
  credentials:
    name: Check the store credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::Skipping the store builds: no EXPO_TOKEN secret. Create one at https://expo.dev/settings/access-tokens and add it under Settings -> Secrets and variables -> Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q '"projectId"' apps/mobile/app.json; then
            echo "::notice::Skipping the store builds: apps/mobile/app.json has no extra.eas.projectId. Run 'npx eas-cli init' in apps/mobile once and commit the change."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  store:
    name: Store builds (EAS)
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      android_build: ${{ steps.build.outputs.android_build }}
      ios_build: ${{ steps.build.outputs.ios_build }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Build the signed AAB and App Store IPA
        id: build
        working-directory: apps/mobile
        run: |
          pnpm exec eas build --platform all --profile production --non-interactive --wait --json > "$RUNNER_TEMP/store.json"
          node -e '
            const builds = require(process.argv[1]);
            for (const build of builds) {
              const url = build.artifacts?.buildUrl;
              const platform = (build.platform ?? "unknown").toLowerCase();
              if (!url) {
                console.error(`No artifact URL for ${platform}`, JSON.stringify(build).slice(0, 1000));
                process.exit(1);
              }
              console.log(`${platform} ${build.id} ${url}`);
            }
          ' "$RUNNER_TEMP/store.json" > "$RUNNER_TEMP/urls.txt"
          cat "$RUNNER_TEMP/urls.txt"
          while read -r platform build url; do
            case "$platform" in
              android) ext=aab ;;
              ios) ext=ipa ;;
              *) ext=bin ;;
            esac
            curl -fL "$url" -o "MyMuse-${{ github.ref_name }}-store-$platform.$ext"
          done < "$RUNNER_TEMP/urls.txt"
          ls -l *-store-*.*
          echo "android_build=$(awk '$1 == "android" { print $2 }' "$RUNNER_TEMP/urls.txt")" >> "$GITHUB_OUTPUT"
          echo "ios_build=$(awk '$1 == "ios" { print $2 }' "$RUNNER_TEMP/urls.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-builds
          if-no-files-found: error
          path: |
            apps/mobile/*-store-*.aab
            apps/mobile/*-store-*.ipa

  submit:
    name: Submit to the stores
    needs: [credentials, store]
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
      EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Work out which stores can accept a build
        run: |
          ios=false
          if [ -n "$EXPO_APPLE_ID" ] && [ -n "$EXPO_APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$EXPO_ASC_APP_ID" ] && [ -n "$EXPO_APPLE_TEAM_ID" ]; then
            ios=true
          fi
          android=false
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            android=true
          fi
          echo "SUBMIT_IOS=$ios" >> "$GITHUB_ENV"
          echo "SUBMIT_ANDROID=$android" >> "$GITHUB_ENV"
          echo "App Store Connect: $ios, Google Play: $android"
      - name: Write the Play service account key
        if: env.SUBMIT_ANDROID == 'true'
        run: |
          key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          echo "PLAY_SERVICE_ACCOUNT_KEY=$key" >> "$GITHUB_ENV"
      - name: Point the submit profile at the repository secrets
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const profile = config.submit.production;
            if (process.env.SUBMIT_IOS === "true") {
              profile.ios = {
                ...profile.ios,
                ascAppId: process.env.EXPO_ASC_APP_ID,
                appleTeamId: process.env.EXPO_APPLE_TEAM_ID,
              };
            }
            if (process.env.SUBMIT_ANDROID === "true") {
              profile.android = { ...profile.android, serviceAccountKeyPath: process.env.PLAY_SERVICE_ACCOUNT_KEY };
            }
            fs.writeFileSync("eas.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log(JSON.stringify(config.submit.production));
          '
      - name: Upload to App Store Connect
        if: env.SUBMIT_IOS == 'true'
        working-directory: apps/mobile
        run: pnpm exec eas submit --platform ios --id "${{ needs.store.outputs.ios_build }}" --non-interactive
      - name: Upload to Google Play
        if: env.SUBMIT_ANDROID == 'true'
        working-directory: apps/mobile
        run: pnpm exec eas submit --platform android --id "${{ needs.store.outputs.android_build }}" --non-interactive

  publish:
    name: Publish the release
    needs: [desktop, android, ios, store]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=$(find dist -type f ! -name 'builder-debug.yml' | sort)
          if [ -z "$files" ]; then
            echo "::error::No installer was produced, so there is nothing to publish."
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MyMuse $TAG" --generate-notes
          echo "$files" | tr '\n' '\0' | xargs -0 gh release upload "$TAG" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
